name: One-time Step 3 checkout event

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-step-3.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send post-checkout event for the completed history inspection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NEW_HEAD: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$REPOSITORY/dispatches" -f event_type=post-checkout -F client_payload[previous_head]=30651b440c5c61ee4916f39e216b4928bb471c1d -F client_payload[new_head]="$NEW_HEAD" -f client_payload[branch_name]=main
