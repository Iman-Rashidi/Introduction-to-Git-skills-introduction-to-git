name: One-time Step 3 workflow enabler

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enable-step-3.yml"

permissions:
  actions: write

jobs:
  enable-step-3:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Step 3 by workflow file path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/$REPOSITORY/actions/workflows/3-step.yml/enable"
